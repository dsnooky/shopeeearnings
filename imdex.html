<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shortlink Generator</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
body{
  font-family:Arial;
  background:#0f172a;
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.box{
  background:#020617;
  padding:25px;
  border-radius:10px;
  width:100%;
  max-width:420px;
}
input,button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:5px;
  border:none;
}
button{
  background:#38bdf8;
  font-weight:bold;
  cursor:pointer;
}
a{color:#38bdf8;}
</style>
</head>
<body>

<div class="box">
  <h2>🔗 Shortlink Generator</h2>

  <input id="longUrl" placeholder="Paste long URL">
  <input id="customCode" placeholder="Custom code (optional)">
  <button onclick="createLink()">Create Short Link</button>

  <div id="result"></div>
</div>

<script>
// 🔥 PASTE YOUR FIREBASE CONFIG HERE
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

function randomCode(){
  return Math.random().toString(36).substring(2, 7);
}

async function createLink(){
  const url = longUrl.value.trim();
  let code = customCode.value.trim() || randomCode();

  if(!url) return alert("Enter a URL");

  await db.collection("links").doc(code).set({
    url: url,
    created: Date.now()
  });

  const short = `${location.origin}${location.pathname.replace("index.html","")}s.html#${code}`;
  result.innerHTML = `Short link:<br><a href="${short}" target="_blank">${short}</a>`;
}
</script>

</body>
</html>
